name: Feature
description: 새로운 기능 또는 사용자 경험 개선을 제안합니다.
title: "feat: "
labels: ["feat", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 기능 요약
      description: 어떤 기능을 추가하려는지 한두 문장으로 적어 주세요.
      placeholder: 예) 변환된 PNG의 QR 공유 만료 시간을 화면에 표시합니다.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 사용자 문제, 제품 가치, 운영상 필요성을 적어 주세요.
      placeholder: 예) 사용자가 공유 링크가 언제 만료되는지 알 수 없어 저장 시점을 판단하기 어렵습니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 개발 범위
      description: 프론트엔드, Supabase, 문서 등 예상되는 변경 영역을 적어 주세요.
      placeholder: |
        - frontend: ShareView에 만료 시간 표시
        - backend: conversions.expires_at 응답 확인
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: PR에서 확인해야 할 기준을 체크리스트로 적어 주세요.
      value: |
        - [ ] 사용자가 기능 결과를 화면에서 확인할 수 있다.
        - [ ] 새 동작이 기존 이미지 변환 흐름을 깨지 않는다.
        - [ ] 필요한 경우 README 또는 사용 문서가 갱신되었다.
    validations:
      required: true
