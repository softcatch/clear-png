name: Docs / Chore
description: 문서, 설정, 빌드, 의존성 등 유지보수 작업을 정리합니다.
title: "chore: "
labels: ["chore", "needs-triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 유형
      options:
        - docs
        - chore
        - ci
        - test
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      placeholder: 예) 깨진 README 인코딩을 복구하고 로컬 실행 가이드를 정리합니다.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      placeholder: 예) 신규 기여자가 프로젝트 구조와 Supabase 설정 방법을 이해하기 어렵습니다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: |
        - [ ] 변경 목적이 문서 또는 설정에 반영되었다.
        - [ ] 기존 실행/빌드 흐름이 유지된다.
        - [ ] 필요한 경우 관련 명령어를 검증했다.
